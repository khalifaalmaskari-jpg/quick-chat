<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#10231C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quick Chat">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Quick Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231DA851'/%3E%3Cpath d='M32 14a18 18 0 0 0-15.6 27L14 50l9.3-2.4A18 18 0 1 0 32 14z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #10231C;
    --ink-soft: #1B3A2F;
    --green: #1DA851;
    --green-press: #178B43;
    --bg: #EEF2EF;
    --card: #FFFFFF;
    --line: #DCE4DF;
    --text: #12201A;
    --muted: #66766E;
    --danger: #B3402F;
    --shadow: 0 1px 2px rgba(16,35,28,.06), 0 8px 24px rgba(16,35,28,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1411;
      --card: #14211C;
      --line: #223229;
      --text: #E8F0EB;
      --muted: #8DA196;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; user-select: text; -webkit-user-select: text; }

  /* App bar */
  .bar {
    background: var(--ink);
    color: #F2F7F4;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 54px;
  }
  .bar-row { display: flex; align-items: center; gap: 12px; max-width: 520px; margin: 0 auto; }
  .logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--green);
    display: grid; place-items: center;
    flex: none;
  }
  .logo svg { width: 22px; height: 22px; fill: #fff; }
  .bar h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
  .bar p { margin: 2px 0 0; font-size: 13px; color: #A9C2B6; }

  /* Layout */
  main {
    flex: 1;
    width: 100%;
    max-width: 520px;
    margin: -34px auto 0;
    padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
  }

  /* Number entry */
  .entry { padding: 14px 14px 16px; }
  .field {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 4px 4px 4px;
  }
  .country {
    display: flex; align-items: center; gap: 6px;
    height: 52px; padding: 0 12px 0 10px;
    border-radius: 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    flex: none;
    font-weight: 600;
    font-size: 16px;
  }
  .country .flag { font-size: 22px; line-height: 1; }
  .country svg { width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; }
  #num {
    flex: 1; min-width: 0;
    height: 52px;
    border: 0; outline: 0; background: transparent;
    font-size: 28px; font-weight: 600;
    letter-spacing: .01em;
    font-variant-numeric: tabular-nums;
    caret-color: var(--green);
  }
  #num::placeholder { color: var(--line); font-weight: 500; }
  .preview {
    min-height: 20px;
    padding: 2px 8px 0;
    font-size: 13px;
    color: var(--muted);
  }
  .preview.err { color: var(--danger); }

  /* Keypad */
  .keys {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .key {
    height: 58px;
    border-radius: 14px;
    font-size: 26px;
    font-weight: 500;
    background: var(--bg);
    display: grid; place-items: center;
    transition: transform .08s ease, background .08s ease;
    touch-action: manipulation;
  }
  .key:active { transform: scale(.96); background: var(--line); }
  .key.util { font-size: 14px; font-weight: 600; color: var(--muted); }
  .key svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Message */
  .msg-toggle {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%;
    margin-top: 14px;
    padding: 12px 6px 4px;
    border-top: 1px solid var(--line);
    font-size: 15px; font-weight: 550;
  }
  .msg-toggle span:last-child { color: var(--muted); font-weight: 450; font-size: 13px; }
  .msg-box { display: none; padding: 8px 0 0; }
  .msg-box.open { display: block; }
  textarea {
    width: 100%;
    min-height: 84px;
    resize: none;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-size: 16px;
    line-height: 1.4;
    outline: 0;
  }
  textarea:focus, .country:focus-visible { border-color: var(--green); }

  /* Primary action */
  .go {
    width: 100%;
    height: 58px;
    margin-top: 14px;
    border-radius: 15px;
    background: var(--green);
    color: #fff;
    font-size: 17px; font-weight: 650;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: background .12s ease, opacity .12s ease, transform .08s ease;
  }
  .go svg { width: 22px; height: 22px; fill: #fff; }
  .go:active { background: var(--green-press); transform: scale(.985); }
  .go:disabled { opacity: .38; transform: none; }

  /* Recents */
  .recents { margin-top: 18px; }
  .recents-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 6px 8px;
    font-size: 14px; font-weight: 650;
  }
  .recents-head button { font-size: 13px; font-weight: 550; color: var(--muted); padding: 4px 6px; }
  .recents ul { list-style: none; margin: 0; padding: 0; }
  .recents li + li { border-top: 1px solid var(--line); }
  .row {
    width: 100%;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    text-align: left;
  }
  .row:active { background: var(--bg); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--ink-soft);
    display: grid; place-items: center;
    flex: none;
  }
  .avatar svg { width: 18px; height: 18px; stroke: #BFD6CA; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .row b { display: block; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .row small { color: var(--muted); font-size: 12.5px; }
  .row .chev { margin-left: auto; width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; }
  .empty { padding: 20px 16px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.45; }

  /* Country sheet */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(8,18,14,.5);
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
    z-index: 10;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    max-width: 520px; margin: 0 auto;
    height: 78dvh;
    background: var(--card);
    border-radius: 22px 22px 0 0;
    transform: translateY(100%);
    transition: transform .22s cubic-bezier(.2,.8,.2,1);
    z-index: 11;
    display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sheet.open { transform: translateY(0); }
  .grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 10px auto 6px; }
  .sheet h2 { margin: 6px 20px 10px; font-size: 18px; font-weight: 650; }
  .search { margin: 0 16px 8px; }
  .search input {
    width: 100%; height: 46px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg);
    padding: 0 14px; font-size: 16px; outline: 0;
  }
  .search input:focus { border-color: var(--green); }
  .clist { flex: 1; overflow-y: auto; padding: 0 8px 12px; -webkit-overflow-scrolling: touch; }
  .crow {
    width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 12px; border-radius: 12px; text-align: left; font-size: 16px;
  }
  .crow:active { background: var(--bg); }
  .crow .flag { font-size: 24px; }
  .crow .dial { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .crow.sel { background: var(--bg); font-weight: 600; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    transform: translate(-50%, 20px);
    background: var(--ink); color: #F2F7F4;
    padding: 12px 18px; border-radius: 12px;
    font-size: 14px; max-width: 86vw; text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-row">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 13.9c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
    </div>
    <div>
      <h1>Quick Chat</h1>
      <p>Message any number, no contact needed</p>
    </div>
  </div>
</header>

<main>
  <section class="card entry">
    <div class="field">
      <button class="country" id="countryBtn" aria-label="Choose country code">
        <span class="flag" id="cFlag">🇦🇪</span>
        <span id="cDial">+971</span>
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <input id="num" type="text" inputmode="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Phone number" aria-label="Phone number">
    </div>
    <div class="preview" id="preview"></div>

    <div class="keys" id="keys">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key util" id="pasteBtn">Paste</button>
      <button class="key" data-k="0">0</button>
      <button class="key" id="delBtn" aria-label="Delete">
        <svg viewBox="0 0 24 24"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7 6-7z"/><path d="M13 10l4 4M17 10l-4 4"/></svg>
      </button>
    </div>

    <button class="msg-toggle" id="msgToggle" aria-expanded="false">
      <span>Add a message</span>
      <span id="msgState">Optional</span>
    </button>
    <div class="msg-box" id="msgBox">
      <textarea id="msg" placeholder="Type a message to pre-fill the chat" rows="3"></textarea>
    </div>

    <button class="go" id="go" disabled>
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 13.9c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
      Open chat
    </button>
  </section>

  <section class="recents" id="recents" hidden>
    <div class="recents-head">
      <span>Recent</span>
      <button id="clearBtn">Clear</button>
    </div>
    <div class="card"><ul id="recentList"></ul></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Country codes">
  <div class="grab"></div>
  <h2>Country code</h2>
  <div class="search"><input id="cSearch" type="text" placeholder="Search country or code" autocomplete="off"></div>
  <div class="clist" id="cList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var COUNTRIES = [
    ["AE","🇦🇪","United Arab Emirates","971"],["SA","🇸🇦","Saudi Arabia","966"],["QA","🇶🇦","Qatar","974"],
    ["KW","🇰🇼","Kuwait","965"],["BH","🇧🇭","Bahrain","973"],["OM","🇴🇲","Oman","968"],
    ["EG","🇪🇬","Egypt","20"],["JO","🇯🇴","Jordan","962"],["LB","🇱🇧","Lebanon","961"],
    ["IQ","🇮🇶","Iraq","964"],["SY","🇸🇾","Syria","963"],["PS","🇵🇸","Palestine","970"],
    ["YE","🇾🇪","Yemen","967"],["SD","🇸🇩","Sudan","249"],["LY","🇱🇾","Libya","218"],
    ["TN","🇹🇳","Tunisia","216"],["DZ","🇩🇿","Algeria","213"],["MA","🇲🇦","Morocco","212"],
    ["IN","🇮🇳","India","91"],["PK","🇵🇰","Pakistan","92"],["BD","🇧🇩","Bangladesh","880"],
    ["LK","🇱🇰","Sri Lanka","94"],["NP","🇳🇵","Nepal","977"],["AF","🇦🇫","Afghanistan","93"],
    ["IR","🇮🇷","Iran","98"],["TR","🇹🇷","Turkey","90"],["PH","🇵🇭","Philippines","63"],
    ["ID","🇮🇩","Indonesia","62"],["MY","🇲🇾","Malaysia","60"],["SG","🇸🇬","Singapore","65"],
    ["CN","🇨🇳","China","86"],["JP","🇯🇵","Japan","81"],["KR","🇰🇷","South Korea","82"],
    ["GB","🇬🇧","United Kingdom","44"],["IE","🇮🇪","Ireland","353"],["FR","🇫🇷","France","33"],
    ["DE","🇩🇪","Germany","49"],["ES","🇪🇸","Spain","34"],["IT","🇮🇹","Italy","39"],
    ["NL","🇳🇱","Netherlands","31"],["CH","🇨🇭","Switzerland","41"],["SE","🇸🇪","Sweden","46"],
    ["PL","🇵🇱","Poland","48"],["GR","🇬🇷","Greece","30"],["CY","🇨🇾","Cyprus","357"],
    ["UA","🇺🇦","Ukraine","380"],["RU","🇷🇺","Russia","7"],["US","🇺🇸","United States / Canada","1"],
    ["MX","🇲🇽","Mexico","52"],["BR","🇧🇷","Brazil","55"],["AU","🇦🇺","Australia","61"],
    ["NZ","🇳🇿","New Zealand","64"],["ZA","🇿🇦","South Africa","27"],["NG","🇳🇬","Nigeria","234"],
    ["KE","🇰🇪","Kenya","254"],["ET","🇪🇹","Ethiopia","251"]
  ];

  var $ = function (id) { return document.getElementById(id); };
  var num = $("num"), preview = $("preview"), go = $("go");
  var country = COUNTRIES[0];
  var digits = "";

  /* Storage helpers. Local files can block storage on some phones, so everything is guarded. */
  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  var savedIso = load("qc_country", null);
  if (savedIso) {
    for (var i = 0; i < COUNTRIES.length; i++) if (COUNTRIES[i][0] === savedIso) country = COUNTRIES[i];
  }

  function fmt(d) {
    if (d.length <= 3) return d;
    if (d.length <= 6) return d.slice(0, 3) + " " + d.slice(3);
    return d.slice(0, 3) + " " + d.slice(3, 6) + " " + d.slice(6);
  }
  function local() { return digits.replace(/^0+/, ""); }
  function full() { return country[3] + local(); }
  function valid() { var l = local().length; return l >= 5 && full().length <= 15; }

  function matchCountry(d) {
    var best = null;
    for (var i = 0; i < COUNTRIES.length; i++) {
      var c = COUNTRIES[i];
      if (d.indexOf(c[3]) === 0 && (!best || c[3].length > best[3].length)) best = c;
    }
    return best;
  }

  function haptic() { try { if (navigator.vibrate) navigator.vibrate(6); } catch (e) {} }

  var toastTimer;
  function toast(text) {
    var t = $("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  /* Takes raw text, pasted or typed, and works out country and local digits. */
  function ingest(raw, fromPaste) {
    var s = (raw || "").trim();
    var intl = s.charAt(0) === "+" || s.indexOf("00") === 0;
    var d = s.replace(/\D/g, "");
    if (s.indexOf("00") === 0) d = d.slice(2);
    if (intl) {
      var m = matchCountry(d);
      if (m) { country = m; save("qc_country", m[0]); d = d.slice(m[3].length); }
    } else if (fromPaste) {
      var dial = country[3];
      if (d.indexOf(dial) === 0 && d.length >= dial.length + 9) d = d.slice(dial.length);
    }
    digits = d.slice(0, 15);
    render();
  }

  function render() {
    num.value = fmt(digits);
    $("cFlag").textContent = country[1];
    $("cDial").textContent = "+" + country[3];
    var ok = valid();
    go.disabled = !ok;
    preview.classList.remove("err");
    if (!digits) {
      preview.textContent = "Enter the number without the country code";
    } else if (!ok) {
      preview.textContent = "Keep going, that looks too short";
    } else {
      preview.textContent = "Opens a chat with +" + country[3] + " " + fmt(local());
    }
  }

  /* Keypad */
  $("keys").addEventListener("click", function (e) {
    var b = e.target.closest("[data-k]");
    if (!b) return;
    haptic();
    if (digits.length < 15) { digits += b.getAttribute("data-k"); render(); }
  });

  var delTimer, longPressed = false;
  var del = $("delBtn");
  function doDelete() { digits = digits.slice(0, -1); render(); }
  del.addEventListener("click", function () {
    if (longPressed) { longPressed = false; return; }
    haptic(); doDelete();
  });
  function startHold() {
    longPressed = false;
    delTimer = setTimeout(function () { longPressed = true; digits = ""; render(); haptic(); }, 550);
  }
  function endHold() { clearTimeout(delTimer); }
  del.addEventListener("touchstart", startHold, { passive: true });
  del.addEventListener("touchend", endHold);
  del.addEventListener("touchcancel", endHold);
  del.addEventListener("mousedown", startHold);
  del.addEventListener("mouseup", endHold);
  del.addEventListener("mouseleave", endHold);

  /* Paste */
  $("pasteBtn").addEventListener("click", function () {
    haptic();
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (t) {
        if (t && /\d/.test(t)) { ingest(t, true); }
        else toast("Nothing that looks like a number on the clipboard");
      }).catch(function () {
        num.focus();
        toast("Press and hold the number box, then tap Paste");
      });
    } else {
      num.focus();
      toast("Press and hold the number box, then tap Paste");
    }
  });

  num.addEventListener("input", function (e) {
    ingest(num.value, e.inputType === "insertFromPaste");
  });
  num.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !go.disabled) openChat();
  });

  /* Message */
  $("msgToggle").addEventListener("click", function () {
    var box = $("msgBox");
    var open = !box.classList.contains("open");
    box.classList.toggle("open", open);
    this.setAttribute("aria-expanded", open);
    $("msgState").textContent = open ? "Hide" : (($("msg").value.trim()) ? "Added" : "Optional");
    if (open) $("msg").focus();
  });

  /* Recents */
  var recents = load("qc_recents", []);
  function addRecent(n, dial) {
    recents = recents.filter(function (r) { return r.n !== n; });
    recents.unshift({ n: n, d: dial });
    recents = recents.slice(0, 8);
    save("qc_recents", recents);
    renderRecents();
  }
  function pretty(r) { return "+" + r.d + " " + fmt(r.n.slice(r.d.length)); }
  function renderRecents() {
    var wrap = $("recents"), list = $("recentList");
    list.innerHTML = "";
    if (!recents.length) { wrap.hidden = true; return; }
    wrap.hidden = false;
    recents.forEach(function (r) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.className = "row";
      b.innerHTML =
        '<span class="avatar"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></span>' +
        '<span><b></b><small>Tap to reuse</small></span>' +
        '<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
      b.querySelector("b").textContent = pretty(r);
      b.addEventListener("click", function () { haptic(); ingest("+" + r.n, false); window.scrollTo({ top: 0, behavior: "smooth" }); });
      li.appendChild(b);
      list.appendChild(li);
    });
  }
  $("clearBtn").addEventListener("click", function () {
    recents = []; save("qc_recents", recents); renderRecents();
  });

  /* Open WhatsApp */
  function openChat() {
    if (!valid()) return;
    var n = full();
    var text = $("msg").value.trim();
    var url = "https://wa.me/" + n + (text ? "?text=" + encodeURIComponent(text) : "");
    addRecent(n, country[3]);
    window.location.href = url;
  }
  go.addEventListener("click", function () { haptic(); openChat(); });

  /* Country sheet */
  var sheet = $("sheet"), scrim = $("scrim"), cSearch = $("cSearch");
  function buildList(q) {
    var list = $("cList");
    list.innerHTML = "";
    q = (q || "").toLowerCase().replace("+", "");
    COUNTRIES.forEach(function (c) {
      if (q && c[2].toLowerCase().indexOf(q) === -1 && c[3].indexOf(q) !== 0) return;
      var b = document.createElement("button");
      b.className = "crow" + (c[0] === country[0] ? " sel" : "");
      b.innerHTML = '<span class="flag"></span><span class="nm"></span><span class="dial"></span>';
      b.querySelector(".flag").textContent = c[1];
      b.querySelector(".nm").textContent = c[2];
      b.querySelector(".dial").textContent = "+" + c[3];
      b.addEventListener("click", function () {
        country = c; save("qc_country", c[0]); closeSheet(); render();
      });
      list.appendChild(b);
    });
  }
  function openSheet() {
    cSearch.value = ""; buildList("");
    sheet.classList.add("open"); scrim.classList.add("open");
  }
  function closeSheet() {
    sheet.classList.remove("open"); scrim.classList.remove("open"); cSearch.blur();
  }
  $("countryBtn").addEventListener("click", openSheet);
  scrim.addEventListener("click", closeSheet);
  cSearch.addEventListener("input", function () { buildList(cSearch.value); });

  render();
  renderRecents();
})();
</script>
</body>
</html>
