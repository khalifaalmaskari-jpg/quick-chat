name: Vendor runtime
on:
  push:
    paths:
      - '.github/workflows/vendor-runtime.yml'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned browser runtimes
        run: |
          mkdir -p vendor
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js -o vendor/react.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js -o vendor/react-dom.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/libphonenumber-js/1.11.20/libphonenumber-js.min.js -o vendor/libphonenumber.min.js
      - name: Commit vendored runtimes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          git commit -m "Vendor pinned browser runtimes for offline use" || exit 0
          git push
